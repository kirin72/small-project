<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두 숫자 계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }

        .result-value {
            color: #667eea;
            font-weight: bold;
            font-size: 24px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calc-button {
            background: #667eea;
            color: white;
        }

        .calc-button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .reset-button {
            background: #f56565;
            color: white;
        }

        .reset-button:hover {
            background: #e53e3e;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>두 숫자 계산기</h1>

        <div class="input-group">
            <label for="num1">첫 번째 숫자</label>
            <input type="number" id="num1" placeholder="숫자를 입력하세요">
        </div>

        <div class="input-group">
            <label for="num2">두 번째 숫자</label>
            <input type="number" id="num2" placeholder="숫자를 입력하세요">
        </div>

        <div class="button-group">
            <button class="calc-button" onclick="calculate()">계산하기</button>
            <button class="reset-button" onclick="reset()">초기화</button>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-item">
                <span class="result-label">더한 값 (+)</span>
                <span class="result-value" id="sumResult">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">곱한 값 (×)</span>
                <span class="result-value" id="multiplyResult">0</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            // input 요소들 가져오기
            const num1Input = document.getElementById('num1');
            const num2Input = document.getElementById('num2');

            // 입력된 값을 숫자로 변환
            const num1 = parseFloat(num1Input.value);
            const num2 = parseFloat(num2Input.value);

            // 입력 값 확인
            if (isNaN(num1) || isNaN(num2)) {
                alert('두 숫자를 모두 입력해주세요!');
                return;
            }

            // 더하기와 곱하기 계산
            const sum = num1 + num2;
            const multiply = num1 * num2;

            // 결과 표시
            document.getElementById('sumResult').textContent = sum;
            document.getElementById('multiplyResult').textContent = multiply;
            document.getElementById('resultSection').style.display = 'block';
        }

        function reset() {
            // 입력 필드 비우기
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';

            // 결과 영역 숨기기
            document.getElementById('resultSection').style.display = 'none';

            // 입력 필드에 포커스
            document.getElementById('num1').focus();
        }

        // Enter 키로도 계산할 수 있게 하기
        document.getElementById('num1').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('num2').focus();
            }
        });

        document.getElementById('num2').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>
